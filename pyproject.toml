[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fieldwork-mcp"
version = "0.1.0"
description = "Read-only MCP server for the Fieldwork pest-control field service API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "fieldwork-mcp contributors" }]
keywords = [
  "mcp",
  "fieldwork",
  "pest-control",
  "field-service",
  "model-context-protocol",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "cryptography>=42.0.0",
  "httpx>=0.27.0",
  "mcp>=1.6.0,<2",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "respx>=0.21.0",
  "ruff>=0.9.0",
]

[project.scripts]
fieldwork-mcp = "fieldwork_mcp.server:main"

[project.urls]
Homepage = "https://github.com/daisydaines/fieldwork-mcp"
Documentation = "https://intercom.help/fieldwork/en/articles/2406552-fieldwork-apis"
API = "https://intercom.help/fieldwork/en/articles/2406552-fieldwork-apis"

[tool.hatch.build.targets.wheel]
packages = ["src/fieldwork_mcp"]

[tool.hatch.build.targets.wheel.sources]
"src/fieldwork_mcp" = "fieldwork_mcp"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]